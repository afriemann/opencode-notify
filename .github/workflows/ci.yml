name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions — no write access required for tests.
# Each job may tighten further; no job may widen beyond this.
permissions:
  contents: read

# Cancel any in-progress run for the same ref when a new one is triggered.
# Keeps PRs from queuing up multiple runs on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7 # pinned SHA — Dependabot will update
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
